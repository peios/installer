# One qualified build produces the independently deployable installer and OOBE
# engines, surfaces and automation client, split symbols/debug sources, feature
# packages, and corresponding source.

out_dir = "out"

[source_package]
name = "dev.peios.peios-installer-source"

[build.vendor]
command = '''
set -eu
MSIP_REV=c2c5424f784e9d58ee548200eb2d723aa9539f52
export CARGO_HOME="$PEKIT_OUT/cargo-home"
[ ! -d "$CARGO_HOME" ] || chmod -R u+w "$CARGO_HOME"
rm -rf "$CARGO_HOME" "$PEKIT_OUT/vendor"
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"
grep -F "source = \"git+https://github.com/peios/msip.git?rev=$MSIP_REV#$MSIP_REV\"" Cargo.lock >/dev/null
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
test -f "$PEKIT_OUT/vendor/msip/src/lib.rs"
test -f "$PEKIT_OUT/vendor/msip/LICENSE"
[ ! -d "$CARGO_HOME" ] || chmod -R u+w "$CARGO_HOME"
rm -rf "$CARGO_HOME"
'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust"          = ">= 1.98.1, < 2"
"org.git.git"                 = "*"
"org.mozilla.ca-certificates" = "*"
"org.gnu.findutils"           = "*"

[build.vendor.dependencies.apt]
cargo           = "*"
git             = "*"
ca-certificates = "*"
findutils       = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
TARGET=x86_64-unknown-linux-musl
DEBUG_PREFIX=/usr/src/debug/dev.peios.peios-installer-$PEKIT_VERSION
DEBUG_ROOT=$PEKIT_OUT$DEBUG_PREFIX
LICENSE_ROOT=$PEKIT_OUT/licenses
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc python3 find sort cmp readelf objcopy strip debugedit gzip; do
  command -v "$tool" >/dev/null || {
    echo "installer: missing required build tool: $tool" >&2
    exit 1
  }
done
cargo metadata --locked --offline --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"installer: workspace versions {versions!r} do not equal {expected!r}")
msip = next(p for p in metadata["packages"] if p["name"] == "msip")
if msip["version"] != "0.1.1":
    got = msip["version"]
    raise SystemExit(f"installer: expected MSIP 0.1.1, got {got}")
expected_source = "git+https://github.com/peios/msip.git?rev=c2c5424f784e9d58ee548200eb2d723aa9539f52#c2c5424f784e9d58ee548200eb2d723aa9539f52"
actual_source = msip.get("source")
if actual_source != expected_source:
    raise SystemExit(f"installer: expected immutable MSIP source {expected_source}, got {actual_source!r}")
'

REMAP_RUSTFLAGS="--remap-path-prefix=$SRC=$DEBUG_PREFIX --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor"
if [ -n "$PEKIT_WORKSPACE_ROOT" ]; then
  REMAP_RUSTFLAGS="--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace $REMAP_RUSTFLAGS"
fi
MUSL_RUSTFLAGS="-Zcf-protection=full -C relocation-model=pic -C link-self-contained=yes -C link-arg=-static-pie -C link-arg=-Wl,-z,ibt -C link-arg=-Wl,-z,shstk -C link-arg=-Wl,-z,relro -C link-arg=-Wl,-z,now -C link-arg=-Wl,-z,pack-relative-relocs -C link-arg=-Wl,--build-id=sha1 $REMAP_RUSTFLAGS"
export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=/usr/bin/cc

RUSTFLAGS="$REMAP_RUSTFLAGS" cargo test --release --workspace --locked --offline \
  --target x86_64-unknown-linux-gnu --target-dir "$PEKIT_OUT/tests"
for tree in build-a build-b; do
  RUSTC_BOOTSTRAP=1 RUSTFLAGS="$MUSL_RUSTFLAGS" cargo build --release --workspace --locked --offline \
    --target "$TARGET" --target-dir "$PEKIT_OUT/$tree"
done
for binary in installerd install-tui msip-drive oobed oobe-tui; do
  cmp "$PEKIT_OUT/build-a/$TARGET/release/$binary" \
      "$PEKIT_OUT/build-b/$TARGET/release/$binary"
done

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" \
         "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/share/man/man1" \
         "$PEKIT_OUT/usr/share/man/man8"
install -m 0755 "$PEKIT_OUT/build-a/$TARGET/release/installerd" "$PEKIT_OUT/usr/sbin/installerd"
install -m 0755 "$PEKIT_OUT/build-a/$TARGET/release/oobed" "$PEKIT_OUT/usr/sbin/oobed"
for binary in install-tui msip-drive oobe-tui; do
  install -m 0755 "$PEKIT_OUT/build-a/$TARGET/release/$binary" "$PEKIT_OUT/usr/bin/$binary"
done
install -m 0644 "$SRC/registry.d/installerd-service.reg" "$PEKIT_OUT/usr/share/regim/installerd-service.reg"
install -m 0644 "$SRC/registry.d/oobe-service.reg" "$PEKIT_OUT/usr/share/regim/oobe-service.reg"
for page in install-tui.1 msip-drive.1 oobe-tui.1; do
  gzip -9n < "$SRC/man/$page" > "$PEKIT_OUT/usr/share/man/man1/$page.gz"
done
for page in installerd.8 oobed.8; do
  gzip -9n < "$SRC/man/$page" > "$PEKIT_OUT/usr/share/man/man8/$page.gz"
done

python3 "$SRC/tools/collect-rust-metadata.py" --licence-root "$LICENSE_ROOT"
test -s "$LICENSE_ROOT/crate-licenses.tsv"

: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list=$PEKIT_OUT/.debug-$component
  debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$first/$rest.debug
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}
split_debug installerd "$PEKIT_OUT/usr/sbin/installerd"
split_debug install-tui "$PEKIT_OUT/usr/bin/install-tui"
split_debug msip-drive "$PEKIT_OUT/usr/bin/msip-drive"
split_debug oobed "$PEKIT_OUT/usr/sbin/oobed"
split_debug oobe-tui "$PEKIT_OUT/usr/bin/oobe-tui"

mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u |
while IFS= read -r source; do
  test -n "$source" || continue
  case "$source" in */) continue ;; esac
  case "$source" in
    "$DEBUG_PREFIX"/vendor/*) relative=${source#"$DEBUG_PREFIX"/}; origin=$PEKIT_VENDOR_OUT/$relative ;;
    "$DEBUG_PREFIX"/*) relative=${source#"$DEBUG_PREFIX"/}; origin=$SRC/$relative ;;
    vendor/*) relative=$source; origin=$PEKIT_VENDOR_OUT/$source ;;
    *) relative=$source; origin=$SRC/$source ;;
  esac
  test -f "$origin" || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$relative")"
  cp "$origin" "$DEBUG_ROOT/$relative"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"
test -f "$DEBUG_ROOT/vendor/msip/src/lib.rs"
test -f "$DEBUG_ROOT/vendor/serde/src/lib.rs"
test -f "$LICENSE_ROOT/msip-0.1.1/LICENSE"

for binary in "$PEKIT_OUT/usr/sbin/installerd" "$PEKIT_OUT/usr/sbin/oobed" \
              "$PEKIT_OUT/usr/bin/install-tui" "$PEKIT_OUT/usr/bin/msip-drive" \
              "$PEKIT_OUT/usr/bin/oobe-tui"; do
  "$binary" --help >/dev/null
  "$binary" --version >/dev/null
done
for page in "$PEKIT_OUT/usr/share/man/man1/"*.gz "$PEKIT_OUT/usr/share/man/man8/"*.gz; do
  gzip -t "$page"
done
python3 - "$PEKIT_OUT" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
installer = json.loads((root / "usr/share/regim/installerd-service.reg").read_text())
oobe = json.loads((root / "usr/share/regim/oobe-service.reg").read_text())
def services(seed):
    return {
        key["path"].rsplit("\\", 1)[-1]: {v["name"]: v["data"] for v in key.get("values", [])}
        for key in seed["keys"] if "\\Services\\" in key["path"]
    }
installer_services = services(installer)
oobe_services = services(oobe)
assert installer_services["installerd"]["ImagePath"] == "/sbin/installerd"
assert installer_services["installerd"]["Identity"] == "SYSTEM"
assert oobe_services["oobed"]["ImagePath"] == "/sbin/oobed"
assert oobe_services["oobed"]["Readiness"] == 0
assert oobe_services["oobed"]["Identity"] == "SYSTEM"
assert oobe_services["oobe-tui"]["ImagePath"] == "/bin/oobe-tui"
assert oobe_services["oobe-tui"]["Requires"] == ["oobed"]
PY

for record in \
  "installerd:$PEKIT_OUT/usr/sbin/installerd" \
  "install-tui:$PEKIT_OUT/usr/bin/install-tui" \
  "msip-drive:$PEKIT_OUT/usr/bin/msip-drive" \
  "oobed:$PEKIT_OUT/usr/sbin/oobed" \
  "oobe-tui:$PEKIT_OUT/usr/bin/oobe-tui"
do
  component=${record%%:*}
  elf=${record#*:}
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  ! readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RWE'
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  readelf -dW "$elf" | grep -q 'RELR'
  ! readelf -dW "$elf" | grep -Eq '(NEEDED|RPATH|RUNPATH|TEXTREL)'
  ! readelf -SW "$elf" | grep -q '\.debug_info'
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  # Downstream static archives may retain their own producer-side debug paths;
  # this recipe is responsible for proving that none of its own source or
  # transient build roots leak into the shipped ELF/debug pair.
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE"; do
    test -n "$forbidden" || continue
    ! grep -aF "$forbidden" "$elf" "$debug" >/dev/null
  done
done
'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"org.gnu.coreutils"        = "*"
"org.gnu.diffutils"        = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.gnu.gzip"             = "*"
"org.rust-lang.rust"       = ">= 1.98.1, < 2"
"org.rust-lang.rust-std-x86-64-unknown-linux-musl" = ">= 1.98.1, < 2"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"

[build.main.dependencies.apt]
dash = "*"
coreutils = "*"
diffutils = "*"
findutils = "*"
grep = "*"
sed = "*"
gzip = "*"
cargo = "*"
rustc = "*"
binutils = "*"
debugedit = "*"
python3 = "*"

[test]
needs = ["vendor"]
command = '''
set -eu
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
cargo test --workspace --locked --offline --target x86_64-unknown-linux-gnu
'''

[test.dependencies.peipkg]
"org.git.kernel.dash" = "*"
"org.gnu.coreutils"   = "*"
"org.rust-lang.rust"  = ">= 1.98.1, < 2"

[test.dependencies.apt]
dash = "*"
coreutils = "*"
cargo = "*"
rustc = "*"
