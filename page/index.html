<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Peios Setup</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="stage" id="stage">
    <div class="aurora" aria-hidden="true"><i class="blue"></i><i class="violet"></i><i class="teal"></i></div>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- The intro's copy of the lockup, centre stage. It glides to where the
         header's copy sits and is swapped for it. -->
    <div class="intro" aria-hidden="true">
        <div class="intro-stack" id="intro-stack">
            <div class="lockup" id="intro-lockup">
                <span class="mark-wrap">
                    <svg class="mark" viewBox="0 0 24 24"><rect class="frame" x="2.5" y="2.5" width="19" height="19" rx="5.5" pathLength="1"/><path class="core" d="M8.5 8h7.5v5h-4v3.5H8.5z"/></svg>
                </span>
                <span class="word"><span>P</span><span>e</span><span>i</span><span>o</span><span>s</span></span>
            </div>
            <div class="release" id="release"></div>
        </div>
    </div>

    <header class="top">
        <div class="lockup" id="head-lockup" role="img" aria-label="Peios">
            <span class="mark-wrap">
                <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect class="frame" x="2.5" y="2.5" width="19" height="19" rx="5.5" pathLength="1"/><path class="core" d="M8.5 8h7.5v5h-4v3.5H8.5z"/></svg>
            </span>
            <span class="word" aria-hidden="true"><span>P</span><span>e</span><span>i</span><span>o</span><span>s</span></span>
        </div>
        <div class="edition" id="edition"></div>
    </header>

    <!-- One page at a time, drawn from the state the installer sends. -->
    <main class="page" id="page">
        <section class="turn first" id="turn"></section>
    </main>

    <footer class="bar">
        <div class="left">
            <ol class="ticker" id="ticker" aria-hidden="true"></ol>
            <div class="status" id="status" role="status"><i class="dot"></i><span id="status-text"></span></div>
        </div>
        <div class="right">
            <div class="intro-btns">
                <button class="ghost" id="skip" type="button">Skip intro <span aria-hidden="true">↵</span></button>
                <button class="ghost" id="replay" type="button" aria-label="Replay intro"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4"/><path d="M2.5 2.5v3h3"/></svg><span class="rp-label">Replay intro</span></button>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast" role="status"></div>
    <p class="sr" id="say" aria-live="polite"></p>
    <noscript><p class="noscript">Peios Setup needs JavaScript, which this browser has turned off.</p></noscript>
</div>
</body>
</html>
