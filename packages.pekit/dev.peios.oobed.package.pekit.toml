side_effects = ["man-db"]

[package]
name = "dev.peios.oobed"
description = "Privileged Peios first-boot account and machine setup service"
# The crate closure oobed links; build.main's collect-rust-licences --check
# holds this to what those crates declare.
license = "((MIT OR Apache-2.0) AND Unicode-3.0) AND (Apache-2.0 OR MIT) AND MIT AND (MIT OR Unlicense)"


[dependencies]
"dev.peios.peiosutils" = ">= 0.8.5-1"
"dev.peios.authd-lps" = ">= 0.0.14-1"
"dev.peios.net" = ">= 0.1.1-1"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.oobed/LICENSE"
":licenses/oobed/**" = "usr/share/licenses/dev.peios.oobed/third-party"
":usr/sbin/oobed" = "usr/sbin/oobed"
":usr/share/man/man8/oobed.8.gz" = "usr/share/man/man8/oobed.8.gz"
