[package]
name = "dev.peios.msip-drive-debuginfo"
description = "Debugging symbols for the MSIP automation client"
# The same crate closure as msip-drive; checked by build.main.
license = "((MIT OR Apache-2.0) AND Unicode-3.0) AND (Apache-2.0 OR MIT) AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.msip-drive" = "= {{release}}"
"dev.peios.peios-installer-debugsource" = "= {{release}}"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.msip-drive-debuginfo/LICENSE"
":licenses/msip-drive/**" = "usr/share/licenses/dev.peios.msip-drive-debuginfo/third-party"
":debug/msip-drive/usr/lib/debug/**" = "usr/lib/debug"
