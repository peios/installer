side_effects = ["man-db"]

[package]
name = "dev.peios.installerd"
description = "Privileged Peios installation, repair, and upgrade service"
# The crate closure installerd links; build.main's collect-rust-licences
# --check holds this to what those crates declare.
license = "((MIT OR Apache-2.0) AND Unicode-3.0) AND (Apache-2.0 OR MIT) AND MIT AND (MIT OR Unlicense)"


[dependencies]
"dev.peios.peiosutils" = ">= 0.8.5-1"
# 0.1.3 is the distribution's qualified peipkg baseline.
"dev.peios.peipkg" = ">= 0.1.3-1"
"net.sourceforge.e2fsprogs" = ">= 1.47.4-1"
"io.github.dosfstools.dosfstools" = ">= 4.2-1"

[files]
"@source:LICENSE" = "usr/share/licenses/dev.peios.installerd/LICENSE"
":licenses/installerd/**" = "usr/share/licenses/dev.peios.installerd/third-party"
":usr/sbin/installerd" = "usr/sbin/installerd"
":usr/share/man/man8/installerd.8.gz" = "usr/share/man/man8/installerd.8.gz"
