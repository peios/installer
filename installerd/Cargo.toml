[package]
name = "installerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Peios installer engine: owns the installation flow and speaks MSIP on a socket; surfaces render it"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
msip = { workspace = true }
msip-serve = { path = "../msip-serve" }
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"

[lib]
name = "installerd"
path = "src/lib.rs"

[[bin]]
name = "installerd"
path = "src/main.rs"

[dev-dependencies]
msip-serve = { path = "../msip-serve" }
