name: Recovery controller

on:
  pull_request:

permissions:
  contents: read

jobs:
  recovery-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the PR without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Check the actual recovery controller without a browser or SDK
        run: node --experimental-vm-modules --test --test-reporter=tap dev/browser/ending-state.mjs
