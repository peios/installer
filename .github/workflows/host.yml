name: Host checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      # The workspace has no Peios SDK dependency. Override its production
      # musl target to exercise the dry-run socket tests on the host.
      - name: Test workspace
        run: cargo +1.99.0 test --workspace --locked --target x86_64-unknown-linux-gnu
      - name: Lint workspace
        run: cargo +1.99.0 clippy --workspace --all-targets --locked --target x86_64-unknown-linux-gnu -- -D warnings
