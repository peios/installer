name: Recovery UI

on:
  pull_request:

permissions:
  contents: read

jobs:
  recovery-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the PR without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install exact test-only dependencies
        working-directory: dev/browser/recovery-fixture
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check fixture server and unchanged asset delivery
        working-directory: dev/browser/recovery-fixture
        run: npm run test:fixture
      - name: Install pinned Playwright Chromium
        working-directory: dev/browser/recovery-fixture
        run: npx --no-install playwright install --with-deps chromium
      - name: Check production state wiring without the SDK
        run: |
          mkdir -p dev/browser/recovery-fixture/results/node
          set -o pipefail
          RECOVERY_RESULTS=dev/browser/recovery-fixture/results/node/state.json node --experimental-vm-modules dev/browser/recovery-state.mjs 2>&1 | tee dev/browser/recovery-fixture/results/node/state.log
      - name: Verify the exact baseline fails the recovery assertion
        working-directory: dev/browser/recovery-fixture
        run: |
          mkdir -p results
          set -o pipefail
          npm run test:baseline 2>&1 | tee results/baseline.log
      - name: Check candidate UI in real Chromium
        if: ${{ !cancelled() }}
        working-directory: dev/browser/recovery-fixture
        run: |
          mkdir -p results
          set -o pipefail
          npm test 2>&1 | tee results/candidate.log
      - name: Upload reports, source hashes, screenshots, and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev/browser/recovery-fixture/results/
          if-no-files-found: warn
          retention-days: 14
