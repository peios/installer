[package]
name = "installer-gxwi"
description = "The graphical Peios installer, run as GXWI's overlay."
version = "0.0.1"
edition = "2024"
# msip needs it.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/peios/installer-gxwi"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["http2", "ws"] }
# First-party Rust dependencies are pinned to immutable commits.
msip = { git = "https://github.com/peios/msip.git", rev = "c2c5424f784e9d58ee548200eb2d723aa9539f52", version = "=0.1.1" }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3dffee949a457509078ffc2f423613de330b5401", package = "peios" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
