[package]
name = "installer-gxwi"
description = "The graphical Peios installer, run as GXWI's overlay."
version.workspace = true
edition.workspace = true
# msip needs it.
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["http2", "ws"] }
# First-party Rust dependencies are pinned to immutable commits.
msip = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e", package = "peios" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
